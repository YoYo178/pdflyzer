
services:
  api:
    image: pdflyzer-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./src/backend/.env
    environment:
      USER_CONTENT_DIR: /app/user_content
      HF_HOME: /home/nonroot/.cache/huggingface
    volumes:
      - user_content:/app/user_content
      - model_cache:/home/nonroot/.cache/huggingface
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    image: pdflyzer-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - arq
      - backend.core.worker.WorkerSettings
    env_file:
      - ./src/backend/.env
    environment:
      USER_CONTENT_DIR: /app/user_content
      HF_HOME: /home/nonroot/.cache/huggingface
    volumes:
      - user_content:/app/user_content
      - model_cache:/home/nonroot/.cache/huggingface
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  user_content:
  model_cache:
