<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pdflyzer/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PDFlyzer — chat with your documents. Upload PDFs, ask anything, and get answers with exact citations straight from your files, streamed live."
    />
    <meta name="theme-color" content="#09090b" />
    <title>PDFlyzer — Chat with your documents</title>

    <script>
      (function () {
        const savedTheme = localStorage.getItem('theme');
        // Fallback to system preference if no saved theme exists
        const systemPrefersDark = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches;

        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script type="module" crossorigin src="/pdflyzer/assets/index-BsoZN3tt.js"></script>

  </body>
