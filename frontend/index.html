<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="pdflyzer — chat with your documents. Upload PDFs, ask anything, and get answers with exact citations straight from your files, streamed live."
    />
    <meta name="theme-color" content="#09090b" />
    <title>pdflyzer — Chat with your documents</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pdflyzer-theme');
          var dark = stored ? stored === 'dark' : true;
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
